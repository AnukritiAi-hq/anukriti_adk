[project]
name = "anukriti-adk"
version = "0.1.0"
description = "Track-2 (Optimize) ADK + Gemini submission: making a PGx safety agent production-reliable via deterministic guardrails, with a measured before/after using ADK eval."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
